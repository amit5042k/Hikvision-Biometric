name: QR Generator Android

on:
  push:
    paths:
      - 'qr-generator/**'
      - '.github/workflows/qr-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.QR_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: qr-generator/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Signed release build runs only when the signing secrets are configured
      # (see qr-generator/README.md, "Publishing a signed release").
      - name: Build signed release APK + AAB
        env:
          QR_KEYSTORE_PASSWORD: ${{ secrets.QR_KEYSTORE_PASSWORD }}
          QR_KEY_ALIAS: ${{ secrets.QR_KEY_ALIAS }}
          QR_KEY_PASSWORD: ${{ secrets.QR_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          QR_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: qr-generator-apk
          path: |
            qr-generator/android/app/build/outputs/apk/**/*.apk
            qr-generator/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
