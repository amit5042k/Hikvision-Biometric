plugins {
    id 'com.android.application'
}

android {
    namespace 'org.mgnurbanestate.qrgenerator'
    compileSdk 35

    defaultConfig {
        applicationId 'org.mgnurbanestate.qrgenerator'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'

        // Address of your QR Generator server (qr-generator/server). Set it with
        //   ./gradlew assembleRelease -PqrServerUrl=https://qr.yourdomain.com
        // or the QR_SERVER_URL environment variable (used by the GitHub Action).
        def serverUrl = (project.findProperty('qrServerUrl') ?: System.getenv('QR_SERVER_URL') ?: 'https://qr.example.com')
                .toString().replaceAll('/+$', '')
        buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Release signing is read from environment variables so no secrets live in the repo.
    // See qr-generator/README.md for how to create the keystore.
    def ks = System.getenv('QR_KEYSTORE_FILE')
    if (ks) {
        signingConfigs {
            release {
                storeFile file(ks)
                storePassword System.getenv('QR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('QR_KEY_ALIAS')
                keyPassword System.getenv('QR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // allows http:// servers for local testing, e.g. -PqrServerUrl=http://10.0.2.2:8000 on the emulator
            manifestPlaceholders = [cleartext: 'true']
        }
        release {
            manifestPlaceholders = [cleartext: 'false']
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
